[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sofiya Povargo", email = "sofiyapovargo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.5.4",
    "pydantic-settings>=2.15.0",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "websockets>=17.2",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
ml = [
    "pyannote-audio>=4.0.7",
    "torch>=2.14.1",
]
