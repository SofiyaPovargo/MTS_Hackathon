[project]
name = "api"
version = "0.1.0"
description = "Agreement capture backend: FastAPI + PostgreSQL + Redis + MinIO"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.112",
    "celery[redis]>=5.6.3",
    "fastapi>=0.143.0",
    "icalendar>=7.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

# Heavy ML dependencies live in an optional group so the api image stays light.
# Workers install them with: uv sync --extra ml
[project.optional-dependencies]
ml = [
    "instructor>=1.17.0",
    "numpy>=2.5.4",
    "openai>=3.3.0",
    "pyannote-audio>=4.0.7",
    "silero-vad>=6.0.0",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "torch>=2.14.1",
]

[project.scripts]
api = "app.main:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "instructor>=1.17.0",
    "mypy>=2.4.0",
    "openai>=3.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    # ML libs the pipeline tests use directly; torch/pyannote stay in the ml extra.
    "numpy>=2.5.4",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]
# research/ is a separate uv project with its own tooling; src/app/migrations
# is generated by Alembic. Neither belongs to the API lint gate.
exclude = ["research", "src/app/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
# S101 assert in tests; S104 binding 0.0.0.0 in a containerized server; S105
# "bearer" token_type is not a credential; N818 our exception names are
# deliberate; RUF001/2 flag the intentional Cyrillic words in the RU parser.
ignore = ["S101", "S104", "S105", "N818", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
# research/ is a separate uv project; migrations are generated by Alembic.
exclude = ["src/app/migrations/", "research/"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["celery.*", "boto3.*", "botocore.*", "icalendar.*", "asyncpg.*"]
ignore_missing_imports = true

# pyannote/torch live only in the optional `ml` extra; mypy must stay green both
# with and without them installed (CI never syncs the extra).
[[tool.mypy.overrides]]
module = ["pyannote.*", "pyannote.audio.*", "torch.*"]
ignore_missing_imports = true

# Silero VAD lives in the optional `ml` extra too.
[[tool.mypy.overrides]]
module = ["silero_vad.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and Redis (docker compose up -d postgres redis)"]