[project]
name = "research"
version = "0.1.0"
description = "ML-pipeline research (commitment extraction): notebooks, schemas, gold dataset"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub",
    "instructor",
    "jupyter",
    "numpy>=2.4.6",
    "omegaconf>=2.4.0",
    "openai",
    "pyannote-audio>=4.0.7",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-dotenv",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "torch>=2.14.1",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.uv]
package = false
